[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mt-qa-agent"
version = "0.1.0"
description = "Tool-calling agent that reviews EN -> PT-BR machine translation and returns a scored, structured report"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.5",
  "httpx>=0.27",
]

[project.optional-dependencies]
eval = ["mlflow>=2.10"]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/mtqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
